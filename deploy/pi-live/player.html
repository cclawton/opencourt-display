<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCourt image player</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        cursor: none;
      }

      img {
        display: block;
        width: 100vw;
        height: 100vh;
        object-fit: contain;
      }

      #status {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 3rem;
        color: #fff;
        font: 600 2rem/1.4 system-ui, sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="status">Starting club display…</div>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const source = params.get('image');
        const expectedWidth = Number(params.get('expectedWidth'));
        const expectedHeight = Number(params.get('expectedHeight'));
        const revision = params.get('revision') || '';
        const status = document.querySelector('#status');

        if (!source || source.includes('/') || source.includes('\\')) {
          status.textContent = 'The configured display image is invalid.';
          return;
        }

        const image = new Image();
        image.alt = params.get('alt') || 'Club display';
        image.onload = () => {
          if (
            (expectedWidth && image.naturalWidth !== expectedWidth) ||
            (expectedHeight && image.naturalHeight !== expectedHeight)
          ) {
            status.textContent =
              `Image dimensions ${image.naturalWidth}×${image.naturalHeight} do not match the configured dimensions.`;
            return;
          }
          document.body.replaceChildren(image);
        };
        image.onerror = () => {
          status.textContent = 'The configured display image could not be loaded.';
        };
        image.src = `${source}?opencourtRevision=${encodeURIComponent(revision)}`;
      })();
    </script>
  </body>
</html>
