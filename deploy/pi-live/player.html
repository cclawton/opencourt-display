<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCourt image player</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        cursor: none;
      }

      img {
        display: block;
        position: fixed;
        inset: 0;
        opacity: 0;
        transition: opacity 500ms ease-in-out;
        width: 100vw;
        height: 100vh;
        object-fit: contain;
      }

      img.visible { opacity: 1; }

      @media (prefers-reduced-motion: reduce) {
        img { transition: none; }
      }

      #status {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 3rem;
        color: #fff;
        font: 600 2rem/1.4 system-ui, sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="status">Starting club display…</div>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const revision = params.get('revision') || '';
        const status = document.querySelector('#status');
        let slides;
        const duration = Number(params.get('durationSeconds') || 15);
        try {
          slides = params.has('slides') ? JSON.parse(params.get('slides')) : [{
            image: params.get('image'), expectedWidth: params.get('expectedWidth'),
            expectedHeight: params.get('expectedHeight'), alt: params.get('alt'),
          }];
          if (!Array.isArray(slides) || slides.length < 1 || slides.length > 50 ||
              !Number.isInteger(duration) || duration < 3 || duration > 300 ||
              slides.some(slide => !slide || typeof slide.image !== 'string' ||
                !/^(?:assets\/)?[A-Za-z0-9][A-Za-z0-9._-]*$/.test(slide.image))) {
            throw new Error('The configured display images are invalid.');
          }
        } catch (error) {
          status.textContent = 'The configured display images are invalid.';
          return;
        }

        // Decode the complete slideshow before revealing it. No network is needed.
        Promise.all(slides.map(slide => new Promise((resolve, reject) => {
          const image = new Image();
          image.alt = slide.alt || 'Club display';
          image.onload = () => {
            if ((Number(slide.expectedWidth) && image.naturalWidth !== Number(slide.expectedWidth)) ||
                (Number(slide.expectedHeight) && image.naturalHeight !== Number(slide.expectedHeight))) {
              reject(new Error('An image does not match the configured dimensions.'));
              return;
            }
            resolve(image);
          };
          image.onerror = () => reject(new Error('A display image could not be loaded.'));
          image.src = `${slide.image}?opencourtRevision=${encodeURIComponent(revision)}`;
        }))).then(images => {
          let index = 0;
          images[0].classList.add("visible");
          document.body.replaceChildren(images[0]);
          if (images.length > 1) {
            setInterval(() => {
              const previous = images[index];
              index = (index + 1) % images.length;
              const next = images[index];
              next.classList.remove('visible');
              next.style.zIndex = '1';
              document.body.append(next);
              // Keep the previous image opaque underneath: no flash to black.
              void next.offsetWidth;
              next.classList.add('visible');
              setTimeout(() => {
                previous.remove();
                previous.classList.remove('visible');
                next.style.zIndex = '0';
              }, 550);
            }, duration * 1000);
          }
        }).catch(error => { status.textContent = error.message; });
      })();
    </script>
  </body>
</html>
